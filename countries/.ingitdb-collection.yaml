# NOTE: this file previously declared readme.sub_collections — a readme table
# spec inGitDB has never implemented (CollectionReadmeDef models only
# hide_columns / hide_subcollections / hide_views / hide_triggers /
# data_preview). It was read and discarded. Stripped so the database loads
# under strict validation; intent preserved in ingitdb/ingitdb-go#8.
titles:
  en: Countries
  ru: Страны
  es: Países
  fr: Pays
  de: Länder

record_file:
  name: "{$id}/{$id}.json"
  format: json
  type: "map[string]any"

columns:
  names:
    type: map[locale]string
    required: true
    valueTitle: Name
  population:
    type: int
    title: Population
  area:
    type: int
    title: Area (km²)
  capital:
    type: string
    required: true
