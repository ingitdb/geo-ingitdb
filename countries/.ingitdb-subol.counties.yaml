# NOTE: this file previously declared keys inGitDB has never implemented
# (inherits / min_records_count / max_records_count / record_labels).
# They were read and discarded, so they looked live and did nothing.
# Stripped so the database loads under strict validation.
# Intent preserved in ingitdb/ingitdb-go#7 (inherits) and #8 (the rest).
records_file:
  format: json
  type: "map[id]map[string]any"
  name: "counties.json"

columns:
  names:
    type: map[locale]string
    required: true
    titles:
      en: Country
      ru: Каунти
  province:
    type: string
    titles:
      en: Province
      ru: Провинция
    foreign_key: "../provinces"
