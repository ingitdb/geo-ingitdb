# NOTE: this file previously declared keys inGitDB has never implemented
# (inherits / min_records_count / max_records_count / record_labels).
# They were read and discarded, so they looked live and did nothing.
# Stripped so the database loads under strict validation.
# Intent preserved in ingitdb/ingitdb-go#7 (inherits) and #8 (the rest).
id: slug(.names.en)

titles:
  en: Cities
  ru: Города

record_file:
  name: "{$id}/{$id}.json"
  format: json
  type: "map[string]any"

columns:
  names:
    type: map[locale]string
    required: true
    titles:
      en: City
      ru: Город

  municipal_status:
    type: string
    required: true
    enum:
      - city
      - town
      - village

  population_city:
    type: int
    title: Population (city & suburbs)
    min_value: 0
    max_value: 19000000

  population_metro:
    type: int
    title: Population (metro)
    min_value: 0
    max_value: 19000000

  area:
    type: int
    title: Area (km²)
    min_value: 0
