name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Lint, vet and test every Go package with the fleet's shared workflow. This
  # repository is a data set that carries its importers, not a versioned
  # library, so releases are not tagged from here.
  ci:
    permissions:
      contents: write # declared by the reusable workflow's (disabled) tagging job
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.21.0
    with:
      disable-version-bumping: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The shared workflow gates total coverage, which would include cmd/geo-import
  # (no tests). The new importer is held to 100% statement coverage on its own.
  wb_import_coverage:
    name: wb-import coverage = 100%
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test cmd/wb-import with coverage
        run: |
          set -euo pipefail
          go test ./cmd/wb-import -count=1 -coverprofile=wb-import.cov
          total=$(go tool cover -func=wb-import.cov | awk '$1 == "total:" {print $3}')
          echo "cmd/wb-import statement coverage: ${total}"
          if [ "${total}" != "100.0%" ]; then
            echo "::error::cmd/wb-import coverage is ${total}, required 100.0%"
            go tool cover -func=wb-import.cov | grep -v '100.0%' || true
            exit 1
          fi
